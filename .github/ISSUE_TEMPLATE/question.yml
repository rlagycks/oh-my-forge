name: Question
description: Ask about usage, setup, or how something works
title: "[QUESTION] "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do? What have you already tried or read (docs/features/, CONTRIBUTING.md)?
    validations:
      required: false
